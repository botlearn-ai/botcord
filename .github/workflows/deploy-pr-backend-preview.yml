name: Deploy PR to Dokploy Test
run-name: Deploy PR #${{ inputs.pr_number }} to Dokploy test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository pull request number"
        required: true
        type: string
      run_tests:
        description: "Run backend tests before deploying"
        required: false
        default: true
        type: boolean
      notes:
        description: "Optional deployment notes"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Resolve PR
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_title: ${{ steps.pr.outputs.pr_title }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve same-repository PR head
        id: pr
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const raw = process.env.PR_NUMBER || "";
            const prNumber = Number.parseInt(raw, 10);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${raw}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is ${pr.state}; only open PRs can be deployed.`);
              return;
            }

            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo.full_name !== repoFullName) {
              core.setFailed(`PR #${prNumber} comes from ${pr.head.repo.full_name}; only same-repository PRs can be deployed.`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              core.setFailed(`PR #${prNumber} returned an invalid head SHA.`);
              return;
            }

            core.setOutput("pr_number", String(prNumber));
            core.setOutput("pr_title", pr.title);
            core.setOutput("pr_url", pr.html_url);
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);

      - name: Create summary
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_TESTS: ${{ inputs.run_tests }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Dokploy Test Deployment"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| PR | [#$PR_NUMBER]($PR_URL) |"
            echo "| Branch | \`$HEAD_REF\` |"
            echo "| Commit | \`$HEAD_SHA\` |"
            echo "| Backend tests | $RUN_TESTS |"
            echo "| Notes | ${NOTES:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend Tests
    needs: [prepare]
    if: inputs.run_tests == true
    runs-on: self-hosted
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run backend tests
        run: uv run pytest tests/

  deploy-test:
    name: Deploy Complete Dokploy Test Environment
    needs: [prepare, backend-tests]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (inputs.run_tests == false || needs.backend-tests.result == 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-dokploy-test.yml
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}
    secrets: inherit

  pr-comment:
    name: Comment on PR
    needs: [prepare, backend-tests, deploy-test]
    if: always() && needs.prepare.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post or update deployment comment
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_TITLE: ${{ needs.prepare.outputs.pr_title }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
          DEPLOY_RESULT: ${{ needs.deploy-test.result }}
          RUN_TESTS: ${{ inputs.run_tests }}
          NOTES: ${{ inputs.notes }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const sha = (process.env.HEAD_SHA || "").slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${process.env.HEAD_SHA}`;
            const statusIcon = process.env.DEPLOY_RESULT === "success" ? "✅" : "❌";
            const tests = process.env.RUN_TESTS === "true" ? process.env.TEST_RESULT : "skipped by input";
            const notes = process.env.NOTES ? `\n\nNotes: ${process.env.NOTES}` : "";

            const marker = "<!-- botcord-pr-dokploy-test-deploy -->";
            const body = [
              marker,
              `## ${statusIcon} Dokploy Test Deployment`,
              "",
              "| Item | Value |",
              "|---|---|",
              `| PR | #${prNumber} ${process.env.PR_TITLE || ""} |`,
              `| Branch | \`${process.env.HEAD_REF}\` |`,
              `| Commit | [\`${sha}\`](${commitUrl}) |`,
              `| Backend tests | ${tests} |`,
              `| Deploy | ${process.env.DEPLOY_RESULT} |`,
              "| Frontend | https://www.test.botcord.chat |",
              "| API | https://api.test.botcord.chat |",
              `| Workflow | [View run](${runUrl}) |`,
              notes,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  notify:
    name: Notify Feishu
    needs: [prepare, backend-tests, deploy-test]
    if: always() && needs.prepare.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy-test.result }}" = "success" ]; then
            echo "title=✅ BotCord PR Dokploy Test 部署成功" >> "$GITHUB_OUTPUT"
            echo "color=green" >> "$GITHUB_OUTPUT"
          else
            echo "title=❌ BotCord PR Dokploy Test 部署失败" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/feishu-notify
        with:
          webhook_url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          title: ${{ steps.status.outputs.title }}
          color: ${{ steps.status.outputs.color }}
          commit_msg: ${{ needs.prepare.outputs.pr_title }}
          fields: |
            [
              {"label": "PR", "value": "[#${{ needs.prepare.outputs.pr_number }}](${{ needs.prepare.outputs.pr_url }})"},
              {"label": "分支", "value": "${{ needs.prepare.outputs.head_ref }}"},
              {"label": "Commit", "value": "[${{ needs.prepare.outputs.head_sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.head_sha }})"},
              {"label": "Backend Tests", "value": "${{ needs.backend-tests.result }}"},
              {"label": "Dokploy Test", "value": "${{ needs.deploy-test.result }}"},
              {"label": "触发者", "value": "${{ github.actor }}"}
            ]
          buttons: |
            [
              {"text": "查看 Workflow", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "type": "primary"},
              {"text": "打开 PR", "url": "${{ needs.prepare.outputs.pr_url }}", "type": "default"}
            ]
