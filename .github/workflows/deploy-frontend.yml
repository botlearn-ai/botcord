name: Deploy Frontend Production (reusable)

# Production Vercel deployment. The Dokploy workflow owns the test environment.
on:
  workflow_call:
    inputs:
      env_name:
        description: 'Target environment; only prod is supported'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (default: current SHA)'
        required: false
        type: string
        default: ''
      alias:
        description: 'Optional production alias domain'
        required: false
        type: string
        default: ''
    outputs:
      deploy_url:
        description: 'Vercel deployment URL'
        value: ${{ jobs.deploy.outputs.deploy_url }}

jobs:
  deploy:
    name: Vercel Deploy
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Reject legacy non-production deployment
        if: inputs.env_name != 'prod'
        working-directory: ${{ github.workspace }}
        run: |
          echo "deploy-frontend.yml is production-only; test deploys use deploy-dokploy-test.yml" >&2
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        # --ignore-workspace: frontend/ is intentionally NOT a pnpm workspace member
        # (it has its own pnpm-lock.yaml and is deployed via Vercel). Without this
        # flag, pnpm walks up to the repo-root pnpm-workspace.yaml and installs
        # workspace members instead of frontend's own deps, leaving Next.js missing.
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel env
        working-directory: ${{ github.workspace }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: nextjs-${{ inputs.env_name }}-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.scss') }}
          restore-keys: |
            nextjs-${{ inputs.env_name }}-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-${{ inputs.env_name }}-${{ runner.os }}-

      - name: Vercel build
        working-directory: ${{ github.workspace }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel deploy
        id: deploy
        working-directory: ${{ github.workspace }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Alias deployment
        if: inputs.alias != ''
        working-directory: ${{ github.workspace }}
        run: |
          vercel alias ${{ steps.deploy.outputs.deploy_url }} ${{ inputs.alias }} --token=${{ secrets.VERCEL_TOKEN }}
          echo "✅ Aliased to ${{ inputs.alias }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
