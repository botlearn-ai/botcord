name: Deploy Frontend Production (reusable)

# Release builds a candidate and waits for a reviewed DevOps digest PR + Sync.
# Manual build-only remains a non-deploying diagnostic/rollback preparation path.
on:
  workflow_call:
    inputs:
      env_name:
        description: 'Target environment; only prod is supported'
        required: true
        type: string
      ref:
        description: 'Exact source commit expected in the reviewed image'
        required: false
        type: string
        default: ''
      alias:
        description: 'Deprecated compatibility input; DNS is managed separately'
        required: false
        type: string
        default: ''
      build_only:
        description: 'Build candidate without deployment'
        type: boolean
        default: false
      request_review:
        description: 'Publish the candidate marker consumed by DevOps PR automation'
        type: boolean
        default: false
      preflight_only:
        description: 'Wait for review/sync and validate without production writes'
        type: boolean
        default: false
      publish_mode:
        description: 'Frozen release mode; rollback/redeploy reuse artifacts without building'
        type: string
        default: normal
      candidate_tag:
        description: 'Exact discovery marker selected by candidate preparation'
        type: string
        default: ''
      expected_image:
        description: 'Exact candidate digest required for preflight/deployment'
        type: string
        default: ''
    outputs:
      candidate_tag:
        description: 'Frozen release/rollback discovery marker'
        value: ${{ jobs.build-candidate.outputs.candidate_tag }}
      image:
        description: 'Exact production candidate image'
        value: ${{ jobs.build-candidate.outputs.image }}
      source_sha:
        description: 'Frozen candidate source SHA'
        value: ${{ jobs.build-candidate.outputs.source_sha }}
      deploy_url:
        description: 'Canonical production URL'
        value: ${{ jobs.deploy.outputs.deploy_url }}
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to build or exact source commit to deploy'
        required: false
        type: string
        default: main
      build_only:
        description: 'Build and push a candidate without changing EKS'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: botcord-frontend-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_REPOSITORY: botlearn-ai/botcord-frontend

jobs:
  reject-non-production:
    name: Validate Production Request
    if: inputs.env_name != 'prod' && inputs.env_name != ''
    runs-on: self-hosted
    steps:
      - name: Reject legacy non-production deployment
        run: |
          echo "deploy-frontend.yml is production-only; test deploys use deploy-dokploy-test.yml" >&2
          exit 1

  build-candidate:
    name: Build ARM64 Candidate
    if: inputs.build_only == true && (inputs.env_name == 'prod' || inputs.env_name == '')
    runs-on: [self-hosted, deploy-host, us-east-1, botlearn-runner-us]
    environment: FrontendProduction
    timeout-minutes: 45
    outputs:
      candidate_tag: ${{ steps.existing.outputs.candidate_tag }}
      image: ${{ steps.publish.outputs.image || steps.existing.outputs.image || steps.image.outputs.image }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Require reviewed workflow control from main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve exact source commit
        id: source
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=prod-$SOURCE_SHA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Checkout trusted candidate control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-control
          persist-credentials: false
          sparse-checkout: infra/eks

      - name: Validate public production build configuration
        env:
          APP_URL: ${{ vars.BOTCORD_PROD_APP_URL }}
          HUB_URL: ${{ vars.BOTCORD_PROD_HUB_BASE_URL }}
          SUPABASE_URL: ${{ vars.BOTCORD_PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.BOTCORD_PROD_SUPABASE_ANON_KEY }}
          BETA_GATE_ENABLED: ${{ vars.BOTCORD_PROD_BETA_GATE_ENABLED }}
          SHOW_MESSAGE_STATUS: ${{ vars.BOTCORD_PROD_SHOW_MESSAGE_STATUS }}
        run: |
          set -euo pipefail
          test "$APP_URL" = "https://www.botcord.chat"
          test "$HUB_URL" = "https://api.botcord.chat"
          [[ "$SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]
          test -n "$SUPABASE_ANON_KEY"
          [[ "$BETA_GATE_ENABLED" =~ ^(true|false)$ ]]
          [[ "$SHOW_MESSAGE_STATUS" =~ ^(true|false)$ ]]
          test -n "$ECR_REGISTRY"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Resolve stable candidate or exact historical artifact
        if: inputs.request_review
        id: existing
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          EXPECTED_IMAGE: ${{ inputs.expected_image }}
        run: |
          python3 .deployment-control/infra/eks/release_candidate.py resolve \
            --source-sha "$SOURCE_SHA" --mode "$PUBLISH_MODE" --image "$EXPECTED_IMAGE"

      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.image == ''
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.image == ''

      - name: Build and push immutable candidate
        id: build
        if: steps.existing.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/botlearn-ai/botcord
            com.botcord.release.run-id=${{ github.run_id }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.BOTCORD_PROD_APP_URL }}
            NEXT_PUBLIC_HUB_BASE_URL=${{ vars.BOTCORD_PROD_HUB_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.BOTCORD_PROD_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.BOTCORD_PROD_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_BETA_GATE_ENABLED=${{ vars.BOTCORD_PROD_BETA_GATE_ENABLED }}
            NEXT_PUBLIC_GA_ID=${{ vars.BOTCORD_PROD_GA_ID }}
            SHOW_MESSAGE_STATUS=${{ vars.BOTCORD_PROD_SHOW_MESSAGE_STATUS }}

      - name: Report candidate for DevOps review
        if: steps.existing.outputs.image == ''
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="$ECR_REGISTRY/$IMAGE_REPOSITORY@$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Candidate: $IMAGE"
          echo "Next: review this exact digest in aibrary-devops; this run does not change EKS or DNS."

      - name: Request reviewed DevOps image PR
        if: inputs.request_review && steps.existing.outputs.image == ''
        id: publish
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 .deployment-control/infra/eks/release_candidate.py publish --source-sha "$SOURCE_SHA" --digest "$DIGEST"

      - name: Candidate summary
        env:
          IMAGE: ${{ steps.publish.outputs.image || steps.existing.outputs.image || steps.image.outputs.image }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REQUEST_REVIEW: ${{ inputs.request_review }}
        run: |
          {
            echo "### Frontend candidate"
            echo "Source: $SOURCE_SHA"
            echo "Image: $IMAGE"
            if [ "$REQUEST_REVIEW" = true ]; then
              echo 'DevOps discovers this release candidate automatically; review the generated PR:'
              echo 'https://github.com/readai-team/aibrary-devops/pulls'
              echo 'No production changes occur until review, Sync, and preflight succeed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Reviewed Candidate to EKS
    if: >-
      always() &&
      needs.reject-non-production.result != 'failure' &&
      inputs.build_only != true &&
      (inputs.env_name == 'prod' || github.event_name == 'workflow_dispatch')
    needs: [reject-non-production]
    runs-on: [self-hosted, deploy-host, us-east-1, botlearn-runner-us]
    environment: FrontendProduction
    timeout-minutes: 150
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - name: Require reviewed workflow control from main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout trusted deployment control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-control
          persist-credentials: false
          sparse-checkout: infra/eks

      - name: Resolve manual or frozen deployment source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: .source
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Capture exact deployment source
        id: source
        run: echo "source_sha=$(git -C .source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to ECR for provenance verification
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Wait for exact reviewed candidate and DevOps sync
        if: inputs.preflight_only
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_IMAGE: ${{ inputs.expected_image }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python3 .deployment-control/infra/eks/release_candidate.py wait \
            --source-sha "$SOURCE_SHA" --image "$EXPECTED_IMAGE" --candidate-tag "$CANDIDATE_TAG"

      - name: Preflight or deploy synchronized reviewed manifest
        id: deploy
        env:
          REQUESTED_REF: ${{ steps.source.outputs.source_sha }}
          EXPECTED_IMAGE: ${{ inputs.expected_image }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -euo pipefail
          args=(--source-sha "$REQUESTED_REF")
          if [ -n "$EXPECTED_IMAGE" ]; then args+=(--expected-image "$EXPECTED_IMAGE"); fi
          if [ "$PREFLIGHT_ONLY" = true ]; then args+=(--preflight-only); fi
          python3 .deployment-control/infra/eks/deploy_frontend.py "${args[@]}"
          echo "deploy_url=https://www.botcord.chat" >> "$GITHUB_OUTPUT"
