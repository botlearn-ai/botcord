name: Deploy Backend (reusable)

on:
  workflow_call:
    inputs:
      env_name:
        description: 'Target environment: preview | prod'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (default: current SHA)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'Immutable ECR candidate tag'
        value: ${{ jobs.deploy.outputs.image_tag }}

concurrency:
  group: botcord-backend-${{ inputs.env_name }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  PROJECT: botcord-backend

jobs:
  deploy:
    name: Build & Push Candidate
    runs-on: [self-hosted, deploy-host, us-east-1, botlearn-runner-us]
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_ref: ${{ steps.build.outputs.image_ref }}
      source_sha: ${{ steps.build.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build immutable candidate without promoting runtime tag
        id: build
        env:
          TARGET_ENV: ${{ inputs.env_name }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in preview|prod) ;; *) exit 1 ;; esac
          SOURCE_SHA=$(git rev-parse HEAD)
          IMAGE="$ECR_REGISTRY/botlearn-ai/$PROJECT:sha-$SOURCE_SHA"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build --provenance=false --label "org.opencontainers.image.revision=$SOURCE_SHA" -f backend/Dockerfile -t "$IMAGE" backend/
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --region us-east-1 --repository-name "botlearn-ai/$PROJECT" --image-ids "imageTag=sha-$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "image_tag=sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_ref=$ECR_REGISTRY/botlearn-ai/$PROJECT@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  rollout:
    name: Verify, Migrate and Rollout
    needs: [deploy]
    runs-on: [self-hosted, deploy-host, us-east-1, botlearn-runner-us]
    environment: ${{ inputs.env_name == 'prod' && 'Production' || 'Preview' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.deploy.outputs.source_sha }}
      - name: Login to the fixed US registry
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Deploy with conversation migration gate and recovery
        env:
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          TARGET_ENV: ${{ inputs.env_name }}
          CANDIDATE_IMAGE: ${{ needs.deploy.outputs.image_ref }}
        run: python3 backend/scripts/deploy_backend.py --environment "$TARGET_ENV" --image "$CANDIDATE_IMAGE"
