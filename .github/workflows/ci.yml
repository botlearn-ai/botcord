name: CI

# Pull requests run validation only. Pushes to main deploy the shared Dokploy test environment.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Detect which packages changed ────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: self-hosted
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      packages: ${{ steps.filter.outputs.packages }}
      gateway_ingress: ${{ steps.filter.outputs.gateway_ingress }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-dokploy-test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-dokploy-test.yml'
            packages:
              - 'cli/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-packages.yml'
              - '.github/workflows/publish-package-manual.yml'
            gateway_ingress:
              - 'packages/gateway-ingress/**'
              - 'packages/protocol-core/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-dokploy-test.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
              - 'frontend/vercel.json'

  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: self-hosted
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/

  # ── Frontend: vitest ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: self-hosted
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # --ignore-workspace: frontend/ is not a workspace member; see deploy-frontend.yml.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Run vitest
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test -- --run

  # ── Packages: protocol-core + cli + daemon build ────────────────────────────
  packages-ci:
    name: Packages CI
    runs-on: self-hosted
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Build and test packages
        run: pnpm check:packages

  # ── Gateway ingress: vitest ──────────────────────────────────────────────────
  gateway-ingress-ci:
    name: Gateway Ingress CI
    runs-on: self-hosted
    needs: [changes]
    if: needs.changes.outputs.gateway_ingress == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Build + test
        run: |
          pnpm --filter @botcord/protocol-core build
          pnpm --filter @botcord/gateway-ingress build
          pnpm --filter @botcord/gateway-ingress test

  infra-ci:
    name: Infrastructure Contracts
    runs-on: self-hosted
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate infrastructure contracts
        run: |
          bash -n infra/compose/local.sh
          bash infra/eks/check_workflows.sh
          python3 -m unittest discover -s infra/tests -v

  deploy-dokploy-test:
    name: Deploy Dokploy Test
    needs: [changes, backend-ci, frontend-ci, packages-ci, gateway-ingress-ci, infra-ci]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.gateway_ingress == 'true' ||
        needs.changes.outputs.infra == 'true'
      ) &&
      (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
      (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped') &&
      (needs.packages-ci.result == 'success' || needs.packages-ci.result == 'skipped') &&
      (needs.gateway-ingress-ci.result == 'success' || needs.gateway-ingress-ci.result == 'skipped') &&
      (needs.infra-ci.result == 'success' || needs.infra-ci.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-dokploy-test.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  notify:
    name: Notify Feishu
    runs-on: self-hosted
    needs:
      - changes
      - backend-ci
      - frontend-ci
      - packages-ci
      - gateway-ingress-ci
      - infra-ci
      - deploy-dokploy-test
    if: always() && needs.changes.result == 'success'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Determine status
        id: status
        env:
          BE_CI: ${{ needs.backend-ci.result }}
          FE_CI: ${{ needs.frontend-ci.result }}
          PKG_CI: ${{ needs.packages-ci.result }}
          GW_CI: ${{ needs.gateway-ingress-ci.result }}
          INFRA_CI: ${{ needs.infra-ci.result }}
          TEST_DEPLOY: ${{ needs.deploy-dokploy-test.result }}
        run: |
          FAIL=0
          for R in "$BE_CI" "$FE_CI" "$PKG_CI" "$GW_CI" "$INFRA_CI" "$TEST_DEPLOY"; do
            if [[ "$R" == "failure" || "$R" == "cancelled" ]]; then FAIL=1; fi
          done
          if [[ $FAIL -eq 0 ]]; then
            echo "color=green" >> "$GITHUB_OUTPUT"
            echo "title=✅ BotCord CI / Dokploy Test 成功" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
            echo "title=❌ BotCord CI / Dokploy Test 失败" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/feishu-notify
        with:
          webhook_url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          title: ${{ steps.status.outputs.title }}
          color: ${{ steps.status.outputs.color }}
          commit_msg: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          fields: |
            [
              {"label": "分支", "value": "${{ github.head_ref || github.ref_name }}"},
              {"label": "触发者", "value": "${{ github.actor }}"},
              {"label": "Commit", "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"},
              {"label": "Backend CI", "value": "${{ needs.backend-ci.result }}"},
              {"label": "Frontend CI", "value": "${{ needs.frontend-ci.result }}"},
              {"label": "Packages CI", "value": "${{ needs.packages-ci.result }}"},
              {"label": "Gateway Ingress CI", "value": "${{ needs.gateway-ingress-ci.result }}"},
              {"label": "Infra CI", "value": "${{ needs.infra-ci.result }}"},
              {"label": "Dokploy Test", "value": "${{ needs.deploy-dokploy-test.result }}"},
              {"label": "Frontend URL", "value": "https://www.test.botcord.chat"},
              {"label": "API URL", "value": "https://api.test.botcord.chat"}
            ]
          buttons: |
            [
              {"text": "查看 Workflow", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "type": "primary"}
            ]
