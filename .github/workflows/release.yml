name: Release

# Production release — manual trigger.
#
# Source-branch semantics (mirrors botlearn model):
#   main                 → normal release   (archives release/YYYY-MM-DD, promotes release/latest)
#   hotfix/*             → hotfix release   (archives release/YYYY-MM-DD, promotes release/latest)
#   release/latest       → redeploy         (no archive, no promote — just redeploy current latest)
#   release/YYYY-MM-DD   → rollback         (no archive, but still promotes release/latest to that archive)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to publish. Allowed: main, hotfix/*, release/latest, release/*'
        required: false
        default: 'main'
        type: string
      targets:
        description: 'What to deploy (both/all = backend + frontend + gateway-ingress)'
        required: false
        default: 'both'
        type: choice
        options: [both, backend, frontend, all, gateway-ingress]
      frontend_image:
        description: 'Optional exact ECR digest for historical frontend rollback; never a mutable tag'
        required: false
        default: ''
        type: string
      run_migrations:
        description: 'Run production DB migrations before deploying'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes (markdown, optional)'
        required: false
        type: string

permissions:
  contents: write
  deployments: write
  actions: read

# Serialize the full release, including the reviewed frontend PR wait.
concurrency:
  group: botcord-production-release
  cancel-in-progress: false

jobs:
  # ── Resolve publish mode, archive, version ───────────────────────────────────
  prepare:
    name: Prepare Release
    # CI includes a deploy-host job; its waiter must never occupy that runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.publish.outputs.version }}
      publish_mode: ${{ steps.publish.outputs.publish_mode }}
      source_branch: ${{ steps.publish.outputs.source_branch }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
      archive_branch: ${{ steps.publish.outputs.archive_branch }}
      deploy_branch: ${{ steps.publish.outputs.deploy_branch }}
    steps:
      - name: Require reviewed workflow control from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Restore frozen release request on rerun
        if: github.run_attempt != '1'
        uses: actions/download-artifact@v4
        with:
          name: release-request-${{ github.run_id }}
          path: ${{ runner.temp }}/release-request-${{ github.run_id }}
      - name: Resolve frozen source, archive and version
        id: publish
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RELEASE_SNAPSHOT: ${{ runner.temp }}/release-request-${{ github.run_id }}/request.json
        run: python3 infra/eks/prepare_release.py
      - name: Preserve release request for reruns
        if: github.run_attempt == '1'
        uses: actions/upload-artifact@v4
        with:
          name: release-request-${{ github.run_id }}
          path: ${{ runner.temp }}/release-request-${{ github.run_id }}/request.json
          retention-days: 30
          if-no-files-found: error
      - name: Require successful CI for the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
        run: python3 infra/eks/release_candidate.py ci --source-sha "$SOURCE_SHA"
      - name: Archive only the CI-validated frozen source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RELEASE_SNAPSHOT: ${{ runner.temp }}/release-request-${{ github.run_id }}/request.json
        run: python3 infra/eks/prepare_release.py --archive

  frontend-candidate:
    name: Prepare Frontend Candidate
    needs: [prepare]
    if: inputs.targets == 'both' || inputs.targets == 'all' || inputs.targets == 'frontend'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      env_name: prod
      ref: ${{ needs.prepare.outputs.source_sha }}
      build_only: true
      request_review: true
      publish_mode: ${{ needs.prepare.outputs.publish_mode }}
      expected_image: ${{ inputs.frontend_image }}
    secrets: inherit

  frontend-ready:
    name: Review, Sync and Preflight Frontend
    needs: [prepare, frontend-candidate]
    if: inputs.targets == 'both' || inputs.targets == 'all' || inputs.targets == 'frontend'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      env_name: prod
      ref: ${{ needs.prepare.outputs.source_sha }}
      expected_image: ${{ format('928112001319.dkr.ecr.us-east-1.amazonaws.com/botlearn-ai/botcord-frontend@{0}', needs.frontend-candidate.outputs.digest) }}
      preflight_only: true
      candidate_tag: ${{ needs.frontend-candidate.outputs.candidate_tag }}
    secrets: inherit

  release-preflight:
    name: All Production Prerequisites Ready
    needs: [prepare, frontend-candidate, frontend-ready]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed before any production migration or rollout
        env:
          PREPARE: ${{ needs.prepare.result }}
          TARGETS: ${{ inputs.targets }}
          CANDIDATE: ${{ needs.frontend-candidate.result }}
          FRONTEND: ${{ needs.frontend-ready.result }}
        run: |
          set -euo pipefail
          test "$PREPARE" = success
          case "$TARGETS" in
            frontend|both|all) test "$CANDIDATE" = success; test "$FRONTEND" = success ;;
            backend|gateway-ingress) test "$CANDIDATE" = skipped; test "$FRONTEND" = skipped ;;
            *) exit 1 ;;
          esac

  # ── Production DB migrations (optional) ──────────────────────────────────────
  migrate-prod:
    name: Migrate (production)
    needs: [prepare, release-preflight]
    if: inputs.run_migrations == true
    runs-on: self-hosted
    environment: Production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      # setup-python has no prebuilt 3.12 for self-hosted arm64 runners;
      # setup-uv ships a static binary and uv downloads the interpreter itself.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: uv sync
      - name: Run SQL migrations
        run: uv run python scripts/run_sql_migrations.py
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # ── Deploy backend prod ──────────────────────────────────────────────────────
  deploy-backend-prod:
    name: Deploy Backend (prod)
    needs: [prepare, release-preflight, migrate-prod]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped') &&
      (inputs.targets == 'both' || inputs.targets == 'all' || inputs.targets == 'backend')
    uses: ./.github/workflows/deploy-backend.yml
    with:
      env_name: prod
      ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  # ── Deploy frontend prod ─────────────────────────────────────────────────────
  deploy-frontend-prod:
    name: Deploy Frontend (prod)
    needs: [prepare, release-preflight, frontend-candidate, migrate-prod]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped') &&
      (inputs.targets == 'both' || inputs.targets == 'all' || inputs.targets == 'frontend')
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      env_name: prod
      ref: ${{ needs.prepare.outputs.source_sha }}
      expected_image: ${{ format('928112001319.dkr.ecr.us-east-1.amazonaws.com/botlearn-ai/botcord-frontend@{0}', needs.frontend-candidate.outputs.digest) }}
    secrets: inherit

  # ── Deploy gateway-ingress prod ─────────────────────────────────────────────
  deploy-gateway-ingress-prod:
    name: Deploy Gateway Ingress (prod)
    needs: [prepare, release-preflight, migrate-prod]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped') &&
      (inputs.targets == 'both' || inputs.targets == 'all' || inputs.targets == 'gateway-ingress')
    uses: ./.github/workflows/deploy-gateway-ingress.yml
    with:
      env_name: prod
      ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  # ── Promote release/latest ──────────────────────────────────────────────────
  promote-latest:
    name: Promote release/latest
    needs: [prepare, deploy-backend-prod, deploy-frontend-prod, deploy-gateway-ingress-prod]
    if: |
      always() &&
      (needs.deploy-backend-prod.result == 'success' || needs.deploy-backend-prod.result == 'skipped') &&
      (needs.deploy-frontend-prod.result == 'success' || needs.deploy-frontend-prod.result == 'skipped') &&
      (needs.deploy-gateway-ingress-prod.result == 'success' || needs.deploy-gateway-ingress-prod.result == 'skipped') &&
      !(needs.deploy-backend-prod.result == 'skipped' && needs.deploy-frontend-prod.result == 'skipped' && needs.deploy-gateway-ingress-prod.result == 'skipped') &&
      needs.prepare.outputs.publish_mode != 'redeploy'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update release/latest
        run: |
          expected=$(git ls-remote origin refs/heads/release/latest | cut -f1)
          git push origin "${{ needs.prepare.outputs.source_sha }}:refs/heads/release/latest" \
            --force-with-lease="refs/heads/release/latest:$expected"
          echo "✅ ${{ needs.prepare.outputs.deploy_branch }} → ${{ needs.prepare.outputs.source_sha }}"

  # ── GitHub Release + tag ────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [prepare, deploy-backend-prod, deploy-frontend-prod, deploy-gateway-ingress-prod, promote-latest]
    if: |
      always() &&
      (needs.deploy-backend-prod.result == 'success' || needs.deploy-backend-prod.result == 'skipped') &&
      (needs.deploy-frontend-prod.result == 'success' || needs.deploy-frontend-prod.result == 'skipped') &&
      (needs.deploy-gateway-ingress-prod.result == 'success' || needs.deploy-gateway-ingress-prod.result == 'skipped') &&
      !(needs.deploy-backend-prod.result == 'skipped' && needs.deploy-frontend-prod.result == 'skipped' && needs.deploy-gateway-ingress-prod.result == 'skipped') &&
      (needs.promote-latest.result == 'success' || needs.promote-latest.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
          echo "✅ Tagged $VERSION"

      - name: Build changelog
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..${VERSION}" --oneline --no-merges)
          else
            CHANGES=$(git log "${VERSION}" --oneline --no-merges | head -30)
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "changes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: actions/github-script@v9
        env:
          GH_VERSION: ${{ needs.prepare.outputs.version }}
          GH_PUBLISH_MODE: ${{ needs.prepare.outputs.publish_mode }}
          GH_SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          GH_ARCHIVE_BRANCH: ${{ needs.prepare.outputs.archive_branch }}
          GH_DEPLOY_BRANCH: ${{ needs.prepare.outputs.deploy_branch }}
          GH_NOTES: ${{ inputs.notes }}
          GH_CHANGES: ${{ steps.changelog.outputs.changes }}
          GH_PREV_TAG: ${{ steps.changelog.outputs.prev_tag }}
          GH_TARGETS: ${{ inputs.targets }}
        with:
          script: |
            const v = process.env;
            const changelog = v.GH_CHANGES
              ? `## Changes\n\`\`\`\n${v.GH_CHANGES}\n\`\`\``
              : '## Changes\n_First release — no previous tag found._';
            const parts = [
              v.GH_NOTES ? `## Release Notes\n${v.GH_NOTES}\n` : null,
              changelog,
              '\n---',
              `**Publish Mode:** ${v.GH_PUBLISH_MODE}`,
              `**Targets:** ${v.GH_TARGETS}`,
              `**Source Branch:** ${v.GH_SOURCE_BRANCH}`,
              v.GH_ARCHIVE_BRANCH ? `**Archive Branch:** ${v.GH_ARCHIVE_BRANCH}` : null,
              `**Deploy Branch:** ${v.GH_DEPLOY_BRANCH}`,
              v.GH_PREV_TAG ? `**Diff:** [${v.GH_PREV_TAG}...${v.GH_VERSION}](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${v.GH_PREV_TAG}...${v.GH_VERSION})` : null,
            ].filter(Boolean).join('\n');

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag: v.GH_VERSION,
              });
              console.log(`Release already published: ${existing.data.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: v.GH_VERSION,
              name: v.GH_VERSION,
              body: parts,
              prerelease: false,
              draft: false,
            });
            console.log(`✅ Created GitHub release: ${v.GH_VERSION}`);

  # ── Feishu notification ──────────────────────────────────────────────────────
  notify:
    name: Notify Feishu
    runs-on: self-hosted
    needs:
      - prepare
      - frontend-candidate
      - frontend-ready
      - release-preflight
      - migrate-prod
      - deploy-backend-prod
      - deploy-frontend-prod
      - deploy-gateway-ingress-prod
      - promote-latest
      - create-release
    if: always() && needs.prepare.result == 'success'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - id: status
        env:
          PREFLIGHT: ${{ needs.release-preflight.result }}
          DB: ${{ needs.deploy-backend-prod.result }}
          DF: ${{ needs.deploy-frontend-prod.result }}
          DG: ${{ needs.deploy-gateway-ingress-prod.result }}
          PROMOTE: ${{ needs.promote-latest.result }}
          RELEASE: ${{ needs.create-release.result }}
          MODE: ${{ needs.prepare.outputs.publish_mode }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BE_OK=false; FE_OK=false; GW_OK=false
          [[ "$DB" == "success" || "$DB" == "skipped" ]] && BE_OK=true
          [[ "$DF" == "success" || "$DF" == "skipped" ]] && FE_OK=true
          [[ "$DG" == "success" || "$DG" == "skipped" ]] && GW_OK=true

          PROMOTE_OK=false
          if [[ "$PROMOTE" == "success" ]] || [[ "$PROMOTE" == "skipped" && "$MODE" == "redeploy" ]]; then
            PROMOTE_OK=true
          fi

          if [[ "$PREFLIGHT" == success && "$BE_OK" == "true" && "$FE_OK" == "true" && "$GW_OK" == "true" && "$PROMOTE_OK" == "true" && "$RELEASE" == "success" ]]; then
            echo "color=green" >> "$GITHUB_OUTPUT"
            echo "title=🚀 BotCord ${VERSION} 发布成功（${MODE}）" >> "$GITHUB_OUTPUT"
          elif [[ "$PREFLIGHT" == success && "$BE_OK" == "true" && "$FE_OK" == "true" && "$GW_OK" == "true" && "$PROMOTE_OK" == "true" ]]; then
            echo "color=grey" >> "$GITHUB_OUTPUT"
            echo "title=⚠️ BotCord ${VERSION} 部署完成（${MODE}，Release 创建失败）" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
            echo "title=❌ BotCord ${VERSION} 发布失败（${MODE}）" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/feishu-notify
        with:
          webhook_url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          title: ${{ steps.status.outputs.title }}
          color: ${{ steps.status.outputs.color }}
          fields: |
            [
              {"label": "版本", "value": "${{ needs.prepare.outputs.version }}"},
              {"label": "发布模式", "value": "${{ needs.prepare.outputs.publish_mode }}"},
              {"label": "部署目标", "value": "${{ inputs.targets }}"},
              {"label": "源分支", "value": "${{ needs.prepare.outputs.source_branch }}"},
              {"label": "归档分支", "value": "${{ needs.prepare.outputs.archive_branch || '无（回滚/重发）' }}"},
              {"label": "部署分支", "value": "${{ needs.prepare.outputs.deploy_branch }}"},
              {"label": "操作", "value": "${{ needs.prepare.outputs.source_branch }} → ${{ needs.prepare.outputs.deploy_branch }} (prod)"},
              {"label": "触发者", "value": "${{ github.actor }}"},
              {"label": "Frontend 评审与预检", "value": "${{ needs.frontend-ready.result }}"},
              {"label": "发布总预检", "value": "${{ needs.release-preflight.result }}"},
              {"label": "DB 迁移", "value": "${{ needs.migrate-prod.result }}"},
              {"label": "Backend 部署", "value": "${{ needs.deploy-backend-prod.result }}"},
              {"label": "Frontend 部署", "value": "${{ needs.deploy-frontend-prod.result }}"},
              {"label": "Gateway Ingress 部署", "value": "${{ needs.deploy-gateway-ingress-prod.result }}"},
              {"label": "更新 latest", "value": "${{ needs.promote-latest.result }}"},
              {"label": "Release 创建", "value": "${{ needs.create-release.result }}"}
            ]
          buttons: |
            [
              {"text": "查看 Release", "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }}", "type": "primary"},
              {"text": "查看 Workflow", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
            ]
